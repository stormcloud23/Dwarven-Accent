name: Lua translation tests
on:
  push:
    branches: [advanced]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Run translation tests
        run: lua5.1 tests/run.lua
